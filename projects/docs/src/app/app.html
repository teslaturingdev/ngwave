<div class="min-h-full flex flex-col">
  <header
    class="sticky top-0 z-20 flex items-center justify-between gap-4 px-6 h-14 border-b border-surface-200 bg-surface-0/90 backdrop-blur"
  >
    <a routerLink="/" class="flex items-center gap-2">
      <span
        class="inline-flex h-7 w-7 items-center justify-center rounded-nw bg-nw-600 text-white font-bold"
        >N</span
      >
      <span class="font-semibold text-surface-900">NgWave</span>
      <span class="text-xs text-surface-500 hidden sm:inline"
        >Open-source Angular UI</span
      >
    </a>

    <div class="flex items-center gap-2">
      <a
        href="https://github.com"
        target="_blank"
        rel="noopener"
        class="text-sm text-surface-600 hover:text-surface-900 px-2 py-1"
        >GitHub</a
      >
      <button
        type="button"
        (click)="theme.toggle()"
        [attr.aria-label]="
          theme.theme() === 'dark'
            ? 'Switch to light theme'
            : 'Switch to dark theme'
        "
        class="inline-flex h-9 w-9 items-center justify-center rounded-nw border border-surface-200 text-surface-700 hover:bg-surface-100 transition-colors"
      >
        @if (theme.theme() === 'dark') {
          <svg
            class="h-4 w-4"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
            />
          </svg>
        } @else {
          <svg
            class="h-4 w-4"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
          </svg>
        }
      </button>
    </div>
  </header>

  <div class="flex flex-1">
    <aside
      class="w-56 shrink-0 border-r border-surface-200 p-4 hidden md:block"
    >
      <a
        routerLink="/"
        routerLinkActive="text-nw-600 font-medium"
        [routerLinkActiveOptions]="{ exact: true }"
        class="block px-3 py-1.5 rounded-nw text-sm text-surface-700 hover:bg-surface-100"
        >Getting Started</a
      >
      <a
        routerLink="/migrate"
        routerLinkActive="text-nw-600 font-medium bg-surface-100"
        [routerLinkActiveOptions]="{ exact: true }"
        class="block px-3 py-1.5 rounded-nw text-sm text-surface-700 hover:bg-surface-100"
        >Migrate</a
      >
      <a
        routerLink="/migrate/ai"
        routerLinkActive="text-nw-600 font-medium bg-surface-100"
        class="flex items-center gap-1.5 px-3 py-1.5 rounded-nw text-sm text-surface-700 hover:bg-surface-100"
        >Migrate with AI
        <span
          class="rounded-full bg-nw-100 px-1.5 py-0.5 text-[10px] font-semibold uppercase text-nw-700"
          >AI</span
        ></a
      >
      <a
        routerLink="/migrate/report"
        routerLinkActive="text-nw-600 font-medium bg-surface-100"
        class="flex items-center gap-1.5 px-3 py-1.5 rounded-nw text-sm text-surface-700 hover:bg-surface-100"
        >Cost Report
        <span
          class="rounded-full bg-surface-100 px-1.5 py-0.5 text-[10px] font-semibold uppercase text-surface-600"
          >Free</span
        ></a
      >
      <a
        routerLink="/migrate/project"
        routerLinkActive="text-nw-600 font-medium bg-surface-100"
        class="flex items-center gap-1.5 px-3 py-1.5 rounded-nw text-sm text-surface-700 hover:bg-surface-100"
        >Migrate Project
        <span
          class="rounded-full bg-surface-100 px-1.5 py-0.5 text-[10px] font-semibold uppercase text-surface-600"
          >Free</span
        ></a
      >
      <a
        routerLink="/changelog"
        routerLinkActive="text-nw-600 font-medium bg-surface-100"
        class="block px-3 py-1.5 rounded-nw text-sm text-surface-700 hover:bg-surface-100"
        >Changelog</a
      >
      <div
        class="mt-4 mb-1 px-3 text-xs font-semibold uppercase tracking-wide text-surface-400"
      >
        Components
      </div>
      @for (item of components; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="text-nw-600 font-medium bg-surface-100"
          class="block px-3 py-1.5 rounded-nw text-sm text-surface-700 hover:bg-surface-100"
          >{{ item.label }}</a
        >
      }
    </aside>

    <main class="flex-1 min-w-0">
      <div class="max-w-6xl mx-auto px-6 py-10">
        <router-outlet />
      </div>
    </main>
  </div>
</div>
